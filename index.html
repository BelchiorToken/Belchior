<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BEL TOKEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050505;
      color: #f4f1ea;
      font-family: Inter, system-ui, sans-serif;
    }
    .bg {
      position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(118deg, transparent 47%, rgba(255,255,255,.07) 47.4%, transparent 47.8%),
        linear-gradient(62deg, transparent 38%, rgba(255,255,255,.05) 38.4%, transparent 38.8%);
    }
    .wrap { position: relative; max-width: 420px; margin: 0 auto; padding: 36px 18px 48px; text-align: center; }
    .eyebrow { letter-spacing: .42em; font-size: 11px; color: #8a8a8a; }
    h1 { font-weight: 500; font-size: 28px; margin-top: 6px; }
    .mark {
      width: 250px; height: 250px; margin: 26px auto 8px;
      border: 0; background: transparent; color: inherit; cursor: pointer; position: relative;
    }
    .mark:disabled { opacity: .45; cursor: not-allowed; }
    .ring {
      position: absolute; inset: 8px; border-radius: 50%;
      border: 1px solid rgba(243,234,215,.75);
    }
    .ring.inner { inset: 22px; border-color: rgba(243,234,215,.28); }
    .mark.on .ring { animation: spin 10s linear infinite; border-style: dashed; }
    .b {
      font-family: "Libre Bodoni", Didot, "Bodoni MT", serif;
      font-size: 168px; line-height: 1; color: #f3ead7;
      font-weight: 500; position: relative; top: 8px;
    }
    .hint { display: block; margin-top: -8px; letter-spacing: .22em; font-size: 11px; color: #8a8a8a; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #2a2a2a; margin: 22px 0 12px; text-align: left; }
    .grid div { padding: 12px 14px; border-right: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; }
    .grid span { display: block; color: #737373; font-size: 11px; letter-spacing: .14em; }
    .grid strong { font-weight: 500; font-size: 16px; }
    .card { border: 1px solid #2a2a2a; padding: 16px; margin-top: 12px; text-align: left; }
    .label { font-size: 11px; letter-spacing: .22em; color: #737373; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .row span:first-child { color: #a3a3a3; }
    button.btn, input {
      width: 100%; padding: 12px; border: 1px solid #fff; background: #fff; color: #000;
      font-weight: 600; cursor: pointer;
    }
    button.btn.ghost { background: transparent; color: #fff; margin-top: 8px; }
    button.btn:disabled { opacity: .35; cursor: not-allowed; }
    .split { display: flex; gap: 8px; margin-top: 10px; }
    input { background: #000; color: #fff; border-color: #404040; font-weight: 400; }
    .addr { font-family: ui-monospace, monospace; font-size: 13px; margin-bottom: 10px; }
    .tiny { color: #737373; font-size: 12px; margin: 6px 0 8px; }
    .picker {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      display: none; align-items: center; justify-content: center; z-index: 5;
    }
    .picker.on { display: flex; }
    .sheet { width: 320px; background: #0a0a0a; border: 1px solid #2a2a2a; padding: 18px; text-align: left; }
    .sheet button { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <p class="eyebrow">BEL TOKEN</p>
    <h1>Mine</h1>
    <p class="hint"><a href="token.html" style="color:#8a8a8a;text-decoration:none;letter-spacing:.18em">TOKEN PAGE</a></p>
    <button class="mark" id="mark">
      <span class="ring"></span>
      <span class="ring inner"></span>
      <span class="b">B</span>
    </button>
    <span class="hint" id="hint">Connect wallet</span>
    <div class="grid">
      <div><span>STATUS</span><strong id="status">IDLE</strong></div>
      <div><span>ELAPSED</span><strong id="elapsed">00:00:00</strong></div>
      <div><span>PENDING</span><strong id="pending">0.0000</strong></div>
      <div><span>RATE</span><strong>100/24h</strong></div>
    </div>
    <div class="card">
      <div class="label">WALLET</div>
      <div class="addr" id="addr" hidden></div>
      <button class="btn" id="walletBtn">Connect BSC Wallet</button>
    </div>
    <div class="card">
      <div class="label">STAKE</div>
      <div class="row"><span>Your APY</span><span id="apy">3%</span></div>
      <p class="tiny">3% under 10k · 3.5% from 10k · 4% from 100k · 5% from 1M</p>
      <div class="row"><span>Staked</span><span id="staked">0 BEL</span></div>
      <div class="row"><span>Est. / day</span><span id="daily">0.0000 BEL</span></div>
      <div class="row"><span>Pending</span><span id="stakePending">0.000000</span></div>
      <input id="amount" type="number" min="1" value="1000" />
      <div class="split">
        <button class="btn" id="stakeBtn">Stake</button>
        <button class="btn" id="claimStake">Claim</button>
      </div>
      <button class="btn ghost" id="unstake">Unstake all</button>
    </div>
  </div>
  <div class="picker" id="picker">
    <div class="sheet">
      <div class="label">CHOOSE WALLET</div>
      <button class="btn" data-wallet="binance">Binance Wallet</button>
      <button class="btn" data-wallet="trust">Trust Wallet</button>
      <button class="btn" data-wallet="metamask">MetaMask</button>
      <input id="manualAddr" placeholder="Or paste BSC address" style="width:100%;margin-top:10px;padding:12px;background:#000;color:#fff;border:1px solid #404040" />
      <button class="btn" id="useAddr">Use this address</button>
      <button class="btn ghost" id="closePicker">Cancel</button>
    </div>
  </div>
  <script>
    const RATE = 100
    const key = "bel_mining_v3"
    let s = JSON.parse(localStorage.getItem(key) || "{}")
    s = Object.assign({ wallet: null, mining: false, start: null, claimed: 0, staked: 0, stakeStart: null, stakeClaimed: 0 }, s)
    const $ = (id) => document.getElementById(id)
    function apyFor(n) { return n >= 1e6 ? 5 : n >= 1e5 ? 4 : n >= 1e4 ? 3.5 : 3 }
    function save() { localStorage.setItem(key, JSON.stringify(s)) }
    function fmt(ms) {
      const t = Math.floor(ms / 1000)
      return [Math.floor(t/3600), Math.floor((t%3600)/60), t%60].map(n => String(n).padStart(2,"0")).join(":")
    }
    function render() {
      const mining = s.mining && s.start
      $("mark").classList.toggle("on", !!mining)
      $("mark").disabled = !s.wallet
      $("hint").textContent = !s.wallet ? "Connect wallet" : mining ? "Tap to claim" : "Tap to mine"
      $("status").textContent = mining ? "MINING" : "IDLE"
      const elapsed = mining ? Date.now() - s.start : 0
      $("elapsed").textContent = fmt(elapsed)
      $("pending").textContent = ((elapsed / 36e5) / 24 * RATE).toFixed(4)
      if (s.wallet) {
        $("addr").hidden = false
        $("addr").textContent = (s.walletName ? s.walletName + " · " : "") + s.wallet
        $("walletBtn").textContent = "Disconnect"
      } else {
        $("addr").hidden = true
        $("walletBtn").textContent = "Connect BSC Wallet"
      }
      const apy = apyFor(s.staked)
      const years = s.stakeStart ? (Date.now() - s.stakeStart) / (36e5 * 24 * 365) : 0
      const pendingStake = s.staked * (apy / 100) * years
      $("apy").textContent = apy + "%"
      $("staked").textContent = s.staked.toLocaleString() + " BEL"
      $("daily").textContent = (s.staked * (apy / 100) / 365).toFixed(4) + " BEL"
      $("stakePending").textContent = pendingStake.toFixed(6)
    }
    function findProvider(kind) {
      const list = window.ethereum?.providers || []
      const eth = window.ethereum
      if (kind === "binance") return window.BinanceChain || list.find(p => p.isBinance) || (eth?.isBinance ? eth : null)
      if (kind === "trust") return window.trustwallet || list.find(p => p.isTrust || p.isTrustWallet) || (eth?.isTrust ? eth : null)
      if (kind === "metamask") return list.find(p => p.isMetaMask && !p.isBraveWallet) || (eth?.isMetaMask ? eth : null)
      return eth || null
    }
    async function connectProvider(provider, label) {
      if (!provider) {
        alert(label + " was not found in this browser. Install its extension, or open this page inside that wallet's browser.")
        return
      }
      const accounts = await provider.request({ method: "eth_requestAccounts" })
      const chain = await provider.request({ method: "eth_chainId" })
      if (chain !== "0x38") {
        try {
          await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x38" }] })
        } catch (err) {
          if (err.code === 4902) {
            await provider.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: "0x38",
                chainName: "BNB Smart Chain",
                nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
                rpcUrls: ["https://bsc-dataseed.binance.org"],
                blockExplorerUrls: ["https://bscscan.com"],
              }],
            })
          } else throw err
        }
      }
      s.wallet = accounts[0]
      s.walletName = label
      save(); render()
      $("picker").classList.remove("on")
    }
    $("walletBtn").onclick = () => {
      if (s.wallet) { s.wallet = null; s.walletName = null; save(); render(); return }
      $("picker").classList.add("on")
    }
    $("closePicker").onclick = () => $("picker").classList.remove("on")
    $("useAddr").onclick = () => {
      const addr = $("manualAddr").value.trim()
      if (!/^0x[a-fA-F0-9]{40}$/.test(addr)) {
        alert("Paste a full BSC address. It looks like 0x and has 42 characters.")
        return
      }
      s.wallet = addr
      s.walletName = "Pasted address"
      save(); render()
      $("picker").classList.remove("on")
    }
    document.querySelectorAll("[data-wallet]").forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.wallet === "trust" && !findProvider("trust")) {
          const here = encodeURIComponent(location.href)
          location.href = "https://link.trustwallet.com/open_url?coin_id=20000714&url=" + here
          return
        }
        connectProvider(findProvider(btn.dataset.wallet), btn.textContent).catch(e => alert(e.message || "Cancelled"))
      }
    })
    $("mark").onclick = () => {
      if (!s.wallet) return
      if (s.mining && s.start) {
        const earned = ((Date.now() - s.start) / 36e5) / 24 * RATE
        s.claimed += earned
        s.mining = false
        s.start = null
        alert("Claimed " + earned.toFixed(4) + " BEL")
      } else {
        s.mining = true
        s.start = Date.now()
      }
      save(); render()
    }
    $("stakeBtn").onclick = () => {
      if (!s.wallet) return alert("Connect wallet first")
      const n = Number($("amount").value)
      if (!n) return
      if (!s.stakeStart) s.stakeStart = Date.now()
      s.staked += n
      save(); render()
    }
    $("claimStake").onclick = () => {
      const apy = apyFor(s.staked)
      const years = s.stakeStart ? (Date.now() - s.stakeStart) / (36e5 * 24 * 365) : 0
      const earned = s.staked * (apy / 100) * years
      if (earned <= 0) return
      s.stakeClaimed += earned
      s.stakeStart = Date.now()
      alert("Claimed " + earned.toFixed(6) + " BEL")
      save(); render()
    }
    $("unstake").onclick = () => {
      const apy = apyFor(s.staked)
      const years = s.stakeStart ? (Date.now() - s.stakeStart) / (36e5 * 24 * 365) : 0
      s.stakeClaimed += s.staked * (apy / 100) * years
      s.staked = 0
      s.stakeStart = null
      save(); render()
    }
    setInterval(render, 1000)
    render()
  </script>
</body>
</html>
